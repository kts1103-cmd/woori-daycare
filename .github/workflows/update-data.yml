name: 어린이집 데이터 매일 갱신

on:
  schedule:
    - cron: "0 19 * * *"   # 매일 04:00 KST
  workflow_dispatch: {}      # 수동 실행 버튼

permissions:
  contents: write
  issues: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TZ: Asia/Seoul
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install xlrd==2.0.1
      - name: 정보공개포털에서 오늘 기준 데이터 받기
        run: python -I data/update_data.py
        env:
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
      - name: 바뀐 데이터 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/data
          [ -f data/geocode_cache.json ] && git add data/geocode_cache.json
          if git diff --cached --quiet; then
            echo "변경 없음"
          else
            git commit -m "데이터 갱신: $(date +%Y-%m-%d) 기준"
            # 동시에 다른 커밋이 올라와 거부되면 rebase 후 다시 시도
            for i in 1 2 3; do git push && break; git pull --rebase; sleep 5; done
          fi
      - name: 실패하면 이슈로 알림
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create --title "데이터 갱신 실패: $(date +%Y-%m-%d)" \
            --body "자동 갱신이 실패해 앱 데이터는 바뀌지 않았습니다. 로그: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
